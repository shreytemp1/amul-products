name: Amul Stock Notify

on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    # GitHub Actions cron does not support a single 87-minute step.
    # These start times approximate that cadence across the UTC day.
    - cron: '0 0 * * *'
    - cron: '27 1 * * *'
    - cron: '54 2 * * *'
    - cron: '21 4 * * *'
    - cron: '48 5 * * *'
    - cron: '15 7 * * *'
    - cron: '42 8 * * *'
    - cron: '9 10 * * *'
    - cron: '36 11 * * *'
    - cron: '3 13 * * *'
    - cron: '30 14 * * *'
    - cron: '57 15 * * *'
    - cron: '24 17 * * *'
    - cron: '51 18 * * *'
    - cron: '18 20 * * *'
    - cron: '45 21 * * *'
    - cron: '12 23 * * *'

concurrency:
  group: amul-stock-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: amul
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS || vars.TELEGRAM_CHAT_IDS }}
      AMUL_PINCODE: '412101'
      AMUL_SUBSTORE_ALIAS: 'pune-br'
      AMUL_SUBSTORE_ID: '66506004a7cddee1b8adb014'
      SEND_EMPTY_UPDATE: ${{ vars.SEND_EMPTY_UPDATE }}

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error title=Missing secret::Set TELEGRAM_BOT_TOKEN in repository secrets."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_CHAT_IDS" ]; then
            echo "::error title=Missing secret::Set TELEGRAM_CHAT_ID or TELEGRAM_CHAT_IDS in repository secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run stock check
        run: bun run start
