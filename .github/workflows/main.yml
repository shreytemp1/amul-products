name: Amul Tracker Every 30 Minutes

on:
  schedule:
    # Runs every 30 minutes
    - cron: '0,5 * * * *'
  # Manual trigger
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Amul Tracker
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINCODE: ${{ secrets.AMUL_PINCODE }}
          SUBSTORE_ID: ${{ secrets.AMUL_SUBSTORE_ID }}
        run: |
          bun run amul-simple-tracker.ts
